allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Our own freshly-published packages; exempt them from the minimum-release-age
# supply-chain window (first-party, not third-party).
minimumReleaseAgeExclude:
  - "@bitbaum/mail-kit"
  - "bip-kit"
  - "@bitbaum/accountkit"
  - "@bitbaum/whenkit@0.3.3"
  - limitkit@0.2.1
  - "@bitbaum/chartkit@0.7.0"
