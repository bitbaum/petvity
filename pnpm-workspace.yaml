allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Our own freshly-published packages; exempt them from the minimum-release-age
# supply-chain window (first-party, not third-party).
minimumReleaseAgeExclude:
  - "@bitbaum/mail-kit"
  - "bip-kit"
