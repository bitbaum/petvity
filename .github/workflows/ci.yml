# Golden CI floor — see dotfiles/templates/ci/README.md.
# petvity: pnpm + vitest. 61 test files / ~541 cases that never ran on the shared
# branch until now. No `typecheck` script exists, so tsc is invoked directly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Next keeps its compiler output in .next/cache. Without restoring it,
      # every CI run recompiles the whole app from scratch — and the deploy
      # then compiles it a second time. Measured across the fleet on
      # 2026-09-07: of eight repos, exactly one cached this.
      #
      # Keyed on the lockfile so a dependency change invalidates it. The bare
      # restore-key is last on purpose: a stale cache still beats no cache,
      # and Next validates its own entries rather than trusting them.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # SSOT: one definition of "verified" (lint + typecheck + test) lives in
      # package.json `verify`, run identically here and locally.
      - name: Verify
        run: pnpm run verify

      # Build is now GATED. It used to be deferred because next build prerendered
      # /sitemap.xml, which queried Postgres — now the sitemap is `force-dynamic`
      # (+ DB-blip-resilient), so the build is hermetic. Placeholder DB URL just
      # satisfies tools that read the var without connecting.
      - name: Build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
        run: pnpm build
