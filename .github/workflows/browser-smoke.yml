name: Browser smoke

# Every way into an account, in a real Chromium against the production build
# and a throwaway PostgreSQL built from the committed migrations plus the
# cutover import (scripts/ci/account-journey.mjs): the method set on /login,
# /register and /forgot-password at 320px and 390px; sign up, sign out, a
# wrong password refused, sign in; an account imported from Auth.js (bcrypt,
# seeded before the import) signing in with its old password and role; a
# password reset through the mailed link; an email sign-in link; and the
# passkey and two-factor settings. Mail is AccountKit's real mail, caught by
# scripts/ci/mail-sink.cjs instead of being sent. No GOOGLE_* pair is set, and
# no Google provider or Google-only button may appear. The fleet rollout gate
# requires this workflow before a shared-package change ships here.
# Synthetic people only; the OrangeCat and bitbaum sign-in client values below
# exist only so their buttons render, and are never used to sign in.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: browser-smoke-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  account:
    name: account (AccountKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: petvity_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d petvity_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/petvity_smoke
      AUTH_SECRET: synthetic-petvity-journey-secret-at-least-32-chars
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      BASE_URL: http://localhost:3000
      LEGACY_EMAIL: legacy-journey@example.test
      LEGACY_PASSWORD: synthetic legacy journey password
      MAIL_SINK: ${{ runner.temp }}/mail.jsonl
      RESEND_API_KEY: re_ci_sink_only
      RESEND_FROM: Petvity <hello@petvity.orangecat.ch>
      ORANGECAT_OAUTH_CLIENT_ID: petvity-ci
      ORANGECAT_OAUTH_CLIENT_SECRET: ci-only
      SIGNIN_ISSUER: https://morulia.orangecat.ch
      SIGNIN_CLIENT_ID: petvity-ci
      SIGNIN_CLIENT_SECRET: ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # From the committed migrations, batched the way the deploy batches them
      # (loki apply-schema.sh), and then compared with what drizzle-kit push
      # makes of lib/db/schema.ts: a schema change without its migration fails here.
      - name: Schema from the committed migrations
        run: scripts/ci/migrations-replay.sh
      # The rehearsal must pass on the chain, then the real-database journeys
      # (they leave the tables empty), then one Auth.js-era account and the
      # import, for the browser journey.
      - name: AccountKit import and journeys on the chain
        env:
          PETVITY_JOURNEY_DATABASE_URL: postgres://app:app@127.0.0.1:5432/petvity_smoke
        run: |
          pnpm run db:rehearse-import
          pnpm exec vitest run lib/auth/shared
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -X -c "TRUNCATE users, auth_users CASCADE"
          node scripts/ci/seed-legacy-account.mjs
          pnpm run db:rehearse-import
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -X -1 -f scripts/db/accountkit-import.sql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: Account journey
        run: |
          mkdir -p browser-smoke-artifacts
          NODE_OPTIONS="--require ./scripts/ci/mail-sink.cjs" pnpm exec next start -p 3000 > next.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          pnpm run browser:journey
      - name: Keep screenshots and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petvity-account-journey
          path: |
            browser-smoke-artifacts/
            next.log
          retention-days: 14
          if-no-files-found: warn
